  <!-- 白色粗體「銀」字 -->
  <text
    x="64"
    y="89"
    font-family="'PingFang TC', 'Noto Sans TC', 'Heiti TC', 'Microsoft JhengHei', sans-serif"
    font-size="76"
    font-weight="800"
    fill="#ffffff"
    text-anchor="middle"
  >銀</text>
</svg>
