<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#146c6c" />
      <stop offset="100%" stop-color="#0f4c4e" />
    </linearGradient>
  </defs>
  <!-- 圓角深青色方塊底圖（對應計畫書左上角「銀」字 Logo） -->
